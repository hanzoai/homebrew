# The hanzoai Homebrew tap. Formulae are generated by GoReleaser, so there is no
# source here to compile — a formula breaks in exactly one way: it points at a
# release asset that is gone, or one whose bytes are not what it claims.
#
# So the gate installs what the tap promises, short of brew: fetch every url in
# every formula and check it against the sha256 declared next to it. A retagged
# release, a deleted asset or a stale checksum is red; `brew install` from this
# tap working is the same fact.
test:
  - name: assets
    run: |
      awk '/^ *url "/{u=$2} /^ *sha256 "/{gsub(/"/,"",u);s=$2;gsub(/"/,"",s);print u,s}' *.rb \
      | while read -r u s; do
          echo "fetch $u"
          curl -fsSL --max-time 180 "$u" -o /tmp/asset || { echo "MISSING ASSET: $u"; exit 1; }
          echo "$s  /tmp/asset" | sha256sum -c - || exit 1
        done
